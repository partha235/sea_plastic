<!DOCTYPE html>
<html>
<head>
  <title>ESP32-CAM Robot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; text-align: center; margin: 0 auto; padding-top: 30px; }
    table { margin-left: auto; margin-right: auto; }
    td { padding: 8px; }
    .button {
      background-color: #2f4468;
      border: none;
      color: white;
      padding: 10px 20px;
      text-align: center;
      text-decoration: none;
      font-size: 18px;
      margin: 6px 3px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: rgba(0,0,0,0);
    }
    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <h1>ESP32-CAM Robot</h1>
  <img src="" id="photo">
  <table>
    <tr>
      <td colspan="3" align="center">
        <button class="button" onmousedown="toggleCheckbox('forward');" ontouchstart="toggleCheckbox('forward');" onmouseup="toggleCheckbox('stop');" ontouchend="toggleCheckbox('stop');">Forward</button>
      </td>
    </tr>
    <tr>
      <td align="center"><button class="button" onmousedown="toggleCheckbox('left');" ontouchstart="toggleCheckbox('left');" onmouseup="toggleCheckbox('stop');" ontouchend="toggleCheckbox('stop');">Left</button></td>
      <td align="center"><button class="button" onmousedown="toggleCheckbox('stop');" ontouchstart="toggleCheckbox('stop');">Stop</button></td>
      <td align="center"><button class="button" onmousedown="toggleCheckbox('right');" ontouchstart="toggleCheckbox('right');" onmouseup="toggleCheckbox('stop');" ontouchend="toggleCheckbox('stop');">Right</button></td>
    </tr>
    <tr>
      <td align="center"><button class="button" onmousedown="toggleCheckbox('led_on');" ontouchstart="toggleCheckbox('led_on');">LED ON</button></td>
      <td colspan="2" align="right"><button class="button" onmousedown="toggleCheckbox('led_off');" ontouchstart="toggleCheckbox('led_off');">LED OFF</button></td>
    </tr>
  </table>
  <script>
    function toggleCheckbox(x) {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", "/action?go=" + x, true);
      xhr.send();
    }

    window.onload = function () {
      document.getElementById("photo").src = window.location.origin.replace(/:\d+$/, '') + ":81/stream";
    };
  </script>
</body>
</html>
